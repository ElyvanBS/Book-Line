<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/login.css">
    <link rel="shortcut icon" type="imagex/png" href="../img/IconBook.png">

    <title>Book-line</title>
</head>
<body>
    <!--Abertura da Div Container-->

       <div class="container">
        <div class="form-image">

            <img src="../img/imgcadastro/undraw_male_avatar_g98d.svg" style="height:500px ;">

        </div><!--Fechadura da Div Container-->


         <!--Abertura da Div form-->
        <div class="form">
            <form action="#">

                    <div class="form-header">
                        <div class="title">
                            <h1> Faça seu Cadastro</h1>
                        </div>
                        
                        <div class="limpar-button">
                            <button><a href="#"> Limpar</a></button>
                        </div>
                    </div>
                    <!--Abertura da Div input-->
                   <div class="input-group">

                     <div class="input-box">
                        <label for="name">Nome Completo</label>
                        <input id="name" type="text" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="email">E-mail</label>
                        <input id="email" type="email" name="email" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="number">CPF</label>
                        <input id="number" type="text" name="number" placeholder="xxx.xxx.xxx-xx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Confirme sua Senha</label>
                        <input id="password" type="Confirmpassword" name="password" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Telefone</label>
                        <input id="password" type="tel" name="number" placeholder="(xx) xxxx-xxxx" required>
                    </div>
                   

                   </div><!--Fechadura da Div input-->

                   <div class="continue-button">
                    <button><a href="../Html/index.html">Confirmar Cadastro</a></button>
                   </div>
                </form><!--Fechadura da Div Form-->
            </div>

       </div>

</body>

</html>
