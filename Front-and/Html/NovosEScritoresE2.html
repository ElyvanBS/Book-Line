<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Css/NovoEscritores.css">
    <link rel="shortcut icon" type="imagex/png" href="../img/IconBook.png">

    <title>Book-Line</title>
</head>
<body>
         <!--Abertura da Div Container-->

       <div class="container">

        <div class="form-images">

            <img src="../img/imgNovosEscritores/undraw_personal_file_re_5joy.svg" style="height:500px ;">

        </div><!--Fechadura da Div Container-->


         <!--Abertura da Div form-->
        <div class="form">
            <form action="#">

                    <div class="form-header">
                        <div class="title">
                            <h1> Dados da conta</h1>
                        </div>
                        
                    
                    </div>
                    <!--Abertura da Div input-->
                   <div class="input-groups">

                     <div class="input-box">
                        <label for="name">Nome de Usuário</label>
                        <input id="name" type="text" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="number">Data de nascimento</label>
                        <input id="number" type="date" name="number" placeholder="xx/xx/xxxx" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Senha</label>
                        <input id="password" type="password" name="password" placeholder="Digite aqui:" required>
                    </div>

                    <div class="input-box">
                        <label for="password">Confirme sua Senha</label>
                        <input id="password" type="Confirmpassword" name="password" placeholder="Digite aqui:" required>
                    </div>

                   </div><!--Fechadura da Div input-->

                   <div class="confirm-button">
                    <button><a href="../Html/index.html">Confirmar Informações</a</button>
                   </div>
                </form><!--Fechadura da Div Form-->

            </div>
        </div> <!--Fechadura da Div Container-->
      

</body>

</html>
